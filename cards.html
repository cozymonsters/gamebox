<!doctype html>
<html lang="en" class="phone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#faf6ec">
<title>Practice · GameBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gb.css?v=301fbaae">
<style>
.hidden{display:none!important}
body{background:var(--cream)}
#fc{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:0 14px calc(16px + env(safe-area-inset-bottom))}
.fhead{display:flex;align-items:center;gap:10px;padding:12px 0 6px}
.fhead .brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:21px;color:var(--ink);text-decoration:none}
.fhead .brand .ic{width:36px;height:36px;display:inline-flex}
.fhead .brand .ic img{width:100%;height:100%;object-fit:contain}
.fhead .sp{flex:1}
.fhead .score{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-size:18px;background:var(--mustard);border-radius:12px;padding:2px 12px}
.fhead .score .gi{width:18px;height:18px}
.fhead .cnt{font-weight:900;font-size:18px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:2px 12px;font-variant-numeric:tabular-nums}
.setname{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.15;margin:2px 0 8px}
.bar{height:10px;border-radius:10px;background:#e9e2cf;overflow:hidden}
.bar i{display:block;height:100%;background:var(--go);transition:width .3s}
.tools{display:flex;gap:8px;margin:10px 0 12px;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:7px 13px;font-weight:900;font-size:15px;color:var(--ink)}
.tool .gi{width:18px;height:18px}
/* question card */
#play{flex:1;display:flex;flex-direction:column;min-height:0}
.qbox{position:relative;background:#fff;border-radius:26px;box-shadow:0 7px 0 var(--line),0 14px 28px rgba(61,68,134,.1);padding:56px 20px 64px;text-align:center;flex:1;min-height:clamp(140px,24vh,240px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden}
.qbox .tag{position:absolute;top:16px;left:20px;font-size:14px;font-weight:900;color:var(--sub);letter-spacing:.08em;text-transform:uppercase}
/* a question that was missed earlier and is back */
.qbox .again{position:absolute;top:42px;left:20px;display:inline-flex;align-items:center;background:#fdf0cc;color:#93650a;border-radius:999px;padding:5px 12px 5px 9px;gap:6px;font-size:15px;font-weight:900;pointer-events:none}
.qbox .again .gi{width:15px;height:15px}
.qbox .mon{position:absolute;right:12px;bottom:10px;width:70px;height:70px}
.qbox .mon img{width:100%;height:100%;object-fit:contain}
.say{position:absolute;right:14px;top:12px;width:52px;height:52px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.say .gi{width:26px;height:26px}
.big{font-family:var(--display);font-weight:600;font-size:clamp(54px,17vw,88px);line-height:1.05;width:100%;padding:0 26px}
.big.zh{font-family:var(--body);font-weight:900;font-size:clamp(48px,15vw,78px)}
.qtext{font-weight:900;font-size:clamp(21px,6vw,26px);line-height:1.4;text-align:left;align-self:stretch;padding-right:6px}
.qsub{align-self:stretch;text-align:left;background:var(--cream);border-radius:14px;padding:10px 13px;font-size:17px;font-weight:800;line-height:1.45;white-space:pre-line}
.qsub.en{font-family:var(--body);font-weight:700;font-size:19px}   /* English lines: same clear sans-serif as the rest (no Times) */
.qbox.pop{animation:gb-pop .35s}
/* options: reuse the game's four colours */
#opts{margin-top:16px;max-height:none;flex:none;margin-bottom:4px}
#opts:not(.long) .opt{min-height:96px;font-size:clamp(22px,6.6vw,30px)}
#opts.long .opt{font-size:clamp(17px,4.8vw,20px);min-height:60px}
.why{margin-top:12px;background:#e3f1e8;color:#2d5e40;border-radius:14px;padding:11px 14px;font-size:17px;font-weight:800;line-height:1.5}
.nextrow{margin-top:14px}
.nextbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;min-height:62px;border-radius:18px;background:var(--ink);color:#fff;font-family:var(--display);font-weight:600;font-size:23px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.nextbtn .gi{width:22px;height:22px}
.nextbtn:active{transform:translateY(4px)}
/* wrong answer: a card pops up in the middle of the screen; tap anywhere to go on */
.fb{position:fixed;inset:0;z-index:30;background:rgba(29,29,31,.42);display:flex;align-items:center;justify-content:center;padding:20px 18px;cursor:pointer;-webkit-tap-highlight-color:transparent;animation:fbFade .2s}
@keyframes fbFade{from{background:rgba(29,29,31,0)}}
.fbcard{width:min(500px,100%);min-height:min(58vh,480px);display:flex;flex-direction:column;background:#fff;border-radius:28px;box-shadow:0 24px 60px rgba(29,29,31,.35);padding:28px 24px 20px;animation:fbPop .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes fbPop{from{transform:scale(.82);opacity:0}}
.fbtop{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:26px;color:var(--red)}
.fbtop .gi{width:26px;height:26px}
.fbtop{margin-bottom:20px}
.fblbl{margin-top:auto;font-size:13px;font-weight:900;color:var(--sub);letter-spacing:.08em;text-transform:uppercase}
.fbans{display:flex;align-items:center;gap:14px;margin-top:8px;background:#e3f1e8;border-radius:20px;padding:22px 20px;min-height:112px}
.fbans .t{flex:1;min-width:0;font-weight:900;font-size:clamp(22px,6.6vw,28px);line-height:1.35;color:var(--go-d)}
.fbans .en{font-family:var(--display);font-weight:600;font-size:clamp(34px,10.5vw,46px);line-height:1.1;color:var(--ink)}
.fbans .zh{font-weight:900;font-size:clamp(24px,7vw,30px);color:var(--go-d);margin-top:6px}
.fbans .say{position:static;flex:none;background:#fff}
.fbwhy{margin-top:22px;font-size:19px;font-weight:800;line-height:1.7;color:var(--ink)}
.fbgo{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:auto;padding-top:16px;border-top:2px solid var(--line);font-family:var(--display);font-weight:600;font-size:20px;color:var(--sub)}
.fbgo .gi{width:20px;height:20px}
.fbcard>:nth-last-child(2){margin-bottom:auto}
.fbcard>.fbgo{margin-top:26px}
/* done */
.done{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 0 10px}
.done .mon{width:140px;height:140px}
.done .mon img{width:100%;height:100%;object-fit:contain}
.done h2{font-family:var(--display);font-weight:700;font-size:40px;margin:0}
.done .big2{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;color:var(--go-d)}
.done p{margin:0;font-weight:800;color:var(--sub);font-size:17px}
.missed{width:100%;background:var(--paper);border-radius:18px;padding:12px 14px;text-align:left;box-shadow:0 4px 0 var(--line)}
.missed h4{margin:0 0 8px;font-size:15px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em}
.missed li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-weight:900;font-size:17px}
.missed li:first-child{border-top:0}
.missed li span{color:var(--sub);text-align:right}
.missed ul{list-style:none;margin:0;padding:0}
.done .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.done .go{font-size:21px}
.done .soft{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:21px;padding:12px 24px;border-radius:18px;background:var(--mustard);color:var(--ink);box-shadow:0 5px 0 var(--mustard-d)}
.done .soft .gi{width:22px;height:22px}
@media (max-height:720px){ .qbox .mon{display:none} .qbox{padding-bottom:30px} }   /* small phones: keep the word clear */
.isready .setname,.isready .bar{display:none}   /* the ready screen shows the set name itself */
.ready{justify-content:center;gap:14px;padding-bottom:40px}
.ready .mon{width:150px;height:150px}
.ready .mon img{width:100%;height:100%;object-fit:contain}
.ready h2{font-size:clamp(34px,10.5vw,46px);line-height:1.1}
.ready .kicker{font-size:15px;font-weight:900;color:var(--go-d);letter-spacing:.14em;text-transform:uppercase;margin-bottom:-6px}
.ready .info{font-size:19px;color:var(--ink)}
.ready .snd{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:8px 16px;box-shadow:0 3px 0 var(--line)}
.ready .snd .gi{width:20px;height:20px}
.ready .go{font-size:28px;padding:16px 56px;margin-top:10px}
.ready .go .gi{width:24px;height:24px}
.err{margin:40px 0;text-align:center;font-weight:800;color:var(--sub);font-size:17px}
</style>
</head>
<body>
<div id="fc">
  <div class="fhead"><a class="brand" href="./"><span class="ic" data-art="logo"></span>GameBox</a><div class="sp"></div><span class="score" id="score"><i data-i="check"></i> 0</span><span class="cnt" id="cnt">0 / 0</span></div>
  <div class="setname" id="setName">Practice</div>
  <div class="bar"><i id="bar" style="width:0"></i></div>
  <div class="tools" id="tools">
    <button class="tool" id="tDir"><i data-i="swap"></i> <span id="tDirTxt">Mixed</span></button>
    <button class="tool" id="tShuf"><i data-i="refresh"></i> Start over</button>
  </div>

  <div id="play">
    <div class="qbox" id="qbox"></div>
    <div class="opts" id="opts"></div>

  </div>

  <!-- ready screen: the Start tap also unlocks sound on phones, so the first word is read out too -->
  <div class="done ready hidden" id="ready">
    <div class="mon" id="readyMon"></div>
    <div class="kicker" id="readyKicker"></div>
    <h2 id="readyName"></h2>
    <p class="info" id="readyInfo"></p>
    <p class="snd" id="readySnd"><i data-i="volume"></i> Turn your sound on</p>
    <button class="go" id="bStart"><i data-i="play"></i> Start</button>
  </div>

  <div class="done hidden" id="done">
    <div class="mon" id="doneMon"></div>
    <h2>All done!</h2>
    <div class="big2" id="doneScore"></div>
    <p id="doneTxt"></p>
    <div class="missed hidden" id="missedBox"><h4>Practice these again</h4><ul id="missedList"></ul></div>
    <div class="row">
      <button class="soft hidden" id="bMissed"><i data-i="refresh"></i> <span id="bMissedTxt"></span></button>
      <button class="go" id="bRestart"><i data-i="refresh"></i> Start over</button>
    </div>
  </div>
  <div class="err hidden" id="err"></div>
  <div class="fb hidden" id="fb"><div class="fbcard" id="fbcard"></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="gb-art.js?v=6ae51ada"></script>
<script src="gb.js?v=2572a1c8"></script>
<script>
"use strict";
const { $, show, esc, store, shuffle, params, SETS, parseWords, speak, voice, primeVoice, db, beep } = GB;
const DIRS = ["mix","en2zh","zh2en"], DIR_TXT = { mix:"Mixed", en2zh:"English → 中文", zh2en:"中文 → English" };
const Practice = {
  key:"", name:"", items:[], quiz:false, dir:"mix", queue:[], total:0, done:0, right:0, missed:new Set(), cur:null, locked:false,

  async load(){
    const k=params.get("set")||"", r=(params.get("r")||"").replace(/\D/g,""), kid=(params.get("k")||"").trim();
    try{
      if (kid){                                        // a teacher's kit (My Kits page)
        const kit=await GB.kits.get(kid);
        if (!kit) return this.fail("This practice set is not available. Ask your teacher for a new QR code.");
        this.key="k"+kid; this.name=kit.name; this.quiz=kit.type==="quiz"; this.items=kit.items;
      } else if (r.length===4){
        const d=(await db.ref("rooms/"+r+"/deck").get()).val();
        if (!d || !d.words) return this.fail("This practice set is not available. Ask your teacher for a new QR code.");
        this.key="r"+r; this.name=d.name||"My Words"; this.quiz=!!d.quiz; this.items=d.words;
      } else if (SETS[k]){
        this.key=k; this.name=SETS[k].name; this.quiz=!!SETS[k].quiz; this.items=this.quiz ? SETS[k].quiz : parseWords(SETS[k].words);
      } else return this.fail(k ? "This practice link is no longer used. Ask your teacher for the new QR code." : "Practice set not found. Scan the QR code on the big screen again.");
    }catch(e){ return this.fail("Could not load the questions. Check your connection and try again."); }
    // the questions are loaded: leave the database so this page doesn't use up one of the shared live connections (free plan: 100)
    try{ db.goOffline(); }catch(e){}
    if (this.items.length<(this.quiz?1:4)) return this.fail("This set needs at least 4 words.");
    document.title=this.name+" · Practice";
    $("setName").textContent=this.name;
    show($("tDir"), !this.quiz);
    const d=store.get("fc.dir"); if (DIRS.includes(d)) this.dir=d;
    $("tDirTxt").textContent=DIR_TXT[this.dir];
    $("tDir").onclick=()=>{ this.dir=DIRS[(DIRS.indexOf(this.dir)+1)%3]; store.set("fc.dir",this.dir); $("tDirTxt").textContent=DIR_TXT[this.dir]; this.ask(); };
    $("tShuf").onclick=()=>this.start(null);
    $("bRestart").onclick=()=>this.start(null);
    $("bMissed").onclick=()=>this.start([...this.missed]);
    $("fb").onclick=e=>{ if (!e.target.closest(".say")) this.next(); };
    // phones only allow sound after the first tap: unlock it then, and read out the first word if it could not be played yet
    document.addEventListener("pointerdown",()=>{ primeVoice(); if (voice.blocked && this.cur && this.cur.en2zh && !this.locked){ voice.blocked=false; this.voice=speak(this.cur.it[0]); } },true);
    addEventListener("keydown",e=>{ if (!$("fb").classList.contains("hidden") && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); this.next(); } });
    this.ready();
  },
  ready(){
    show($("play"),false); show($("tools"),false); show($("done"),false); show($("ready"),true); $("fc").classList.add("isready");
    $("readyMon").innerHTML=ART.avatar(ART.AVATARS[Math.floor(Math.random()*ART.AVATARS.length)],"",true);
    // "Research Essay · Part 3–4" → big title "Research Essay", small line "Part 3–4 · 50 questions"
    const [title, ...part]=this.name.split(" · "), n=this.items.length;
    $("readyKicker").textContent = this.quiz ? "Quiz Practice" : "Vocabulary Practice";
    $("readyName").textContent=title;
    $("readyInfo").textContent = [...part, this.quiz ? n+" questions" : n+" words"].join(" · ");
    show($("readySnd"), !this.quiz);
    $("cnt").textContent="0 / "+n;
    $("bStart").onclick=()=>{ primeVoice(); this.start(null); };
  },
  fail(msg){ show($("play"),false); show($("tools"),false); show($("ready"),false); $("err").textContent=msg; show($("err"),true); },

  // list = indices to practise (null = everything). Each item is asked once; a wrong one comes back a few questions later.
  start(list){
    const all=this.items.map((_,i)=>i);
    this.queue=shuffle((list&&list.length?list:all).slice()); this.total=this.queue.length;
    this.done=0; this.right=0; this.missed=new Set(); this.firstTry=new Set();
    show($("done"),false); show($("ready"),false); $("fc").classList.remove("isready"); show($("play"),true); show($("tools"),true);
    this.ask();
  },

  ask(){
    this.locked=false; show($("fb"),false); if (scrollY>0) scrollTo({top:0});
    if (!this.queue.length) return this.finish();
    const i=this.queue[0], it=this.items[i], mon=`<span class="mon">${ART.avatar(ART.AVATARS[i % ART.AVATARS.length],"",true)}</span>`
      + (this.missed.has(i) ? `<span class="again">${ART.icon("flag")} Missed before</span>` : "");   // tag on questions they missed before
    let html, opts, answer, long=false, en2zh=false;
    if (this.quiz){
      const sub = it.s ? `<div class="qsub${/[一-鿿]/.test(it.s.replace(/^原文[^：:]*[：:]/,""))?"":" en"}">${esc(it.s)}</div>` : "";
      html=`<span class="tag">Question</span><div class="qtext">${esc(it.q)}</div>${sub}${mon}`;
      opts=shuffle(it.o.map((t,k)=>({t,ok:k===it.a}))); long=true;
    } else {
      const dir = this.dir==="mix" ? (Math.random()<.5?"en2zh":"zh2en") : this.dir; en2zh = dir==="en2zh";
      const pool=shuffle(this.items.map((_,k)=>k).filter(k=>k!==i)).slice(0,3);
      opts=shuffle([i,...pool].map(k=>({t:this.items[k][en2zh?1:0], ok:k===i})));
      html = en2zh
        ? `<span class="tag">What does it mean?</span><button class="say" id="say" aria-label="Listen">${ART.icon("volume")}</button><div class="big">${esc(it[0])}</div>${mon}`
        : `<span class="tag">Which English word?</span><div class="big zh">${esc(it[1])}</div>${mon}`;
    }
    this.cur={i, it, opts, en2zh};
    const Q=$("qbox"); Q.innerHTML=html; Q.classList.remove("pop"); void Q.offsetWidth; Q.classList.add("pop");
    if ($("say")) $("say").onclick=()=>{ this.voice=speak(it[0]); };
    // an English word on the card is read out as soon as it appears (a Chinese prompt stays silent so the answer is not given away)
    this.voice = en2zh ? speak(it[0]) : Promise.resolve();
    const O=$("opts"); O.classList.toggle("long",long);
    O.innerHTML=opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o.t)}</button>`).join("");
    for (const b of O.children) b.onclick=()=>this.answer(+b.dataset.k, b);
    this.fit();
    const n=this.total;
    $("cnt").textContent=Math.min(this.done+1,n)+" / "+n;
    $("bar").style.width=(this.done/n*100)+"%";
    $("score").innerHTML=ART.icon("check")+" "+this.right;
  },

  // big words shrink until they fit on one line
  fit(){ for (const el of document.querySelectorAll(".big")){ el.style.fontSize=""; let f=parseFloat(getComputedStyle(el).fontSize); while (el.scrollWidth>el.clientWidth+1 && f>26){ f-=3; el.style.fontSize=f+"px"; } } },

  answer(k, btn){
    if (this.locked) return; this.locked=true;
    const {i, it, opts}=this.cur, ok=opts[k].ok, btns=[...$("opts").children];
    // English shown: it was already read out when the card appeared. Chinese shown: say the English word now, as the answer
    const said = this.quiz ? Promise.resolve() : this.cur.en2zh ? this.voice : speak(it[0]);
    if (ok){
      btn.classList.add("ok");
      if (!this.missed.has(i)) this.right++;
      this.done++; this.queue.shift();
      beep(880,.08,"triangle",.15); beep(1320,.12,"triangle",.12,.07);
      try{ navigator.vibrate && navigator.vibrate(15); }catch(e){}
      $("score").innerHTML=ART.icon("check")+" "+this.right;
      const wait=ms=>new Promise(r=>setTimeout(r,ms));
      Promise.race([Promise.all([said, wait(800)]), wait(1600)]).then(()=>setTimeout(()=>this.ask(), 250));   // next word after the voice has finished (never more than ~1.8 s)
    } else {
      btn.classList.add("no");
      btns.forEach((b,j)=>{ if (opts[j].ok) b.classList.add("ans"); });
      this.missed.add(i);
      this.queue.shift(); this.queue.splice(Math.min(this.queue.length, 3+Math.floor(Math.random()*3)), 0, i);   // comes back soon
      beep(160,.25,"sawtooth",.12);
      try{ navigator.vibrate && navigator.vibrate(120); }catch(e){}
      const go=`<div class="fbgo">Tap to continue ${ART.icon("play")}</div>`, top=`<div class="fbtop">${ART.icon("x")} Oops!</div>`;
      $("fbcard").innerHTML = this.quiz
        ? `${top}<div class="fblbl">Correct answer</div><div class="fbans"><div class="t">${esc(it.o[it.a])}</div></div>${it.w?`<div class="fbwhy">${esc(it.w)}</div>`:""}${go}`
        : `${top}<div class="fblbl">Correct answer</div><div class="fbans"><div class="t"><div class="en">${esc(it[0])}</div><div class="zh">${esc(it[1])}</div></div><button class="say" id="fbSay" aria-label="Listen">${ART.icon("volume")}</button></div>${go}`;
      if ($("fbSay")) $("fbSay").onclick=e=>{ e.stopPropagation(); speak(it[0]); };
      setTimeout(()=>show($("fb"),true), 450);              // let them see which answer was right first
    }
  },
  next(){ if (!$("fb").classList.contains("hidden")) this.ask(); },

  finish(){
    show($("play"),false); show($("tools"),false); show($("done"),true);
    $("doneMon").innerHTML=ART.img("trophy");
    const n=this.total, r=this.right, m=[...this.missed];
    $("doneScore").textContent=r+" / "+n;
    $("doneTxt").textContent = !m.length ? "Perfect! Every answer right on the first try." : "right on the first try. Every word is learned now!";
    $("cnt").textContent=n+" / "+n; $("bar").style.width="100%";
    show($("missedBox"), m.length>0);
    $("missedList").innerHTML=m.map(i=>{ const it=this.items[i]; return this.quiz ? `<li>${esc(it.q)}<span>${esc(it.o[it.a])}</span></li>` : `<li>${esc(it[0])}<span>${esc(it[1])}</span></li>`; }).join("");
    show($("bMissed"), m.length>0); $("bMissedTxt").textContent="Practice missed ("+m.length+")";
    GB.fanfare && GB.fanfare();
  }
};
Practice.load();
</script>
